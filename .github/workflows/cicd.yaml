name: Build & Deploy FastAPI to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: venu-5198
  REGION: us-east1
  CLUSTER_NAME: fastapi-cluster
  GAR_REPO: gke-backend-repo
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image to Artifact Registry
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          TAG=${{ github.sha }}
          IMAGE_FULL="$IMAGE:$TAG"
          # 👇 specify correct Dockerfile path
          docker build -t "$IMAGE_FULL" -f app/Dockerfile ./app
          docker push "$IMAGE_FULL"
          echo "IMAGE=$IMAGE_FULL" >> $GITHUB_ENV

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }}

      - name: Update k8s manifests image and deploy
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          kubectl set image deployment/backend-deployment backend-container=$IMAGE --record || true
          kubectl apply -f k8s/ --validate=false
          kubectl rollout status deployment/backend-deployment --timeout=120s
          kubectl get pods --selector=app=backend -o wide
          kubectl get svc backend-service -o wide

